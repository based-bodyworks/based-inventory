services:
  - type: keyvalue
    name: based-inventory-state
    plan: free
    ipAllowList: []
    maxmemoryPolicy: noeviction

  # Quantity alerts: ShipHero-sourced. Daily 14:00 UTC (7am Pacific).
  # Was every 6h on Shopify; cadence dropped per 2026-04-28 rewire decision.
  - type: cron
    name: based-inventory-quantity
    runtime: docker
    dockerfilePath: ./Dockerfile
    schedule: "0 14 * * 1-5"
    dockerCommand: python -m based_inventory.jobs.quantity_alerts
    plan: starter
    envVars:
      - key: SHIPHERO_ACCESS_TOKEN
        sync: false
      - key: SHIPHERO_REFRESH_TOKEN
        sync: false
      - key: SHIPHERO_API_URL
        value: https://public-api.shiphero.com/graphql
      # Shopify env vars not used by this job, but Config requires them.
      # Set to placeholders; real values live on the atc_audit service.
      - key: SHOPIFY_STORE
        value: basedbodyworks.myshopify.com
      - key: SHOPIFY_CLIENT_ID
        value: not-used-by-quantity-alerts
      - key: SHOPIFY_CLIENT_SECRET
        value: not-used-by-quantity-alerts
      - key: SHOPIFY_API_VERSION
        value: "2026-01"
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_CHANNEL
        value: C0AK6UGA1NJ
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: STATE_PATH
        fromService:
          type: keyvalue
          name: based-inventory-state
          property: connectionString
      - key: ENV
        value: prod
      - key: DRY_RUN
        value: "0"
      - key: LOG_LEVEL
        value: INFO

  # ATC audit: Shopify-sourced (storefront crawl). Weekly Mon 13:00 UTC
  # (6am Pacific). Was daily; bumped to weekly per Avi 2026-04-30 — the
  # signal type (Add-to-Cart breaks) doesn't move fast enough to warrant
  # daily noise once the false-positive rate is contained.
  - type: cron
    name: based-inventory-atc
    runtime: docker
    dockerfilePath: ./Dockerfile
    schedule: "0 13 * * 1"
    dockerCommand: python -m based_inventory.jobs.atc_audit
    plan: starter
    envVars:
      - key: SHOPIFY_STORE
        sync: false
      - key: SHOPIFY_CLIENT_ID
        sync: false
      - key: SHOPIFY_CLIENT_SECRET
        sync: false
      - key: SHOPIFY_API_VERSION
        value: "2026-01"
      # ShipHero not used here, but Config is shared. Pull from quantity service.
      - fromService:
          name: based-inventory-quantity
          type: cron
          envVarKey: SHIPHERO_ACCESS_TOKEN
        key: SHIPHERO_ACCESS_TOKEN
      - fromService:
          name: based-inventory-quantity
          type: cron
          envVarKey: SHIPHERO_REFRESH_TOKEN
        key: SHIPHERO_REFRESH_TOKEN
      - key: SHIPHERO_API_URL
        value: https://public-api.shiphero.com/graphql
      - fromService:
          name: based-inventory-quantity
          type: cron
          envVarKey: SLACK_BOT_TOKEN
        key: SLACK_BOT_TOKEN
      - key: SLACK_CHANNEL
        value: C0AK6UGA1NJ
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: STATE_PATH
        fromService:
          type: keyvalue
          name: based-inventory-state
          property: connectionString
      - key: ENV
        value: prod
      - key: DRY_RUN
        value: "0"
      - key: LOG_LEVEL
        value: INFO

  # Inventory snapshot: ShipHero-sourced. Mon/Wed/Fri 16:00 UTC (9am Pacific).
  # Bumped from Friday-only 2026-05-08 — once-a-week was too slow to spot
  # backorder buildup mid-week. The job is read-only against ShipHero and
  # sits in a quiet credit-pool window so 3x cadence is safe.
  # Service name (based-inventory-weekly) and module name (weekly_snapshot)
  # are kept for state continuity; rename would tear down the Render service.
  - type: cron
    name: based-inventory-weekly
    runtime: docker
    dockerfilePath: ./Dockerfile
    schedule: "0 16 * * 1,3,5"
    dockerCommand: python -m based_inventory.jobs.weekly_snapshot
    plan: starter
    envVars:
      - fromService:
          name: based-inventory-quantity
          type: cron
          envVarKey: SHIPHERO_ACCESS_TOKEN
        key: SHIPHERO_ACCESS_TOKEN
      - fromService:
          name: based-inventory-quantity
          type: cron
          envVarKey: SHIPHERO_REFRESH_TOKEN
        key: SHIPHERO_REFRESH_TOKEN
      - key: SHIPHERO_API_URL
        value: https://public-api.shiphero.com/graphql
      - key: SHOPIFY_STORE
        value: basedbodyworks.myshopify.com
      - key: SHOPIFY_CLIENT_ID
        value: not-used-by-weekly
      - key: SHOPIFY_CLIENT_SECRET
        value: not-used-by-weekly
      - key: SHOPIFY_API_VERSION
        value: "2026-01"
      - fromService:
          name: based-inventory-quantity
          type: cron
          envVarKey: SLACK_BOT_TOKEN
        key: SLACK_BOT_TOKEN
      - key: SLACK_CHANNEL
        value: C0AK6UGA1NJ
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: ENV
        value: prod
      - key: DRY_RUN
        value: "0"
      - key: LOG_LEVEL
        value: INFO

  # Hourly online master-SKU check. Start with preview output in Render logs.
  - type: cron
    name: based-inventory-hourly
    runtime: docker
    dockerfilePath: ./Dockerfile
    schedule: "10 * * * *"
    dockerCommand: python -m based_inventory.jobs.hourly_stock_watch --post-to-slack
    plan: starter
    envVars:
      - key: SHIPHERO_REFRESH_TOKEN
        fromService:
          name: based-inventory-quantity
          type: cron
          envVarKey: SHIPHERO_REFRESH_TOKEN
      - key: SLACK_BOT_TOKEN
        fromService:
          name: based-inventory-quantity
          type: cron
          envVarKey: SLACK_BOT_TOKEN
      - key: SLACK_CHANNEL
        value: C0AK6UGA1NJ
      - key: DRY_RUN
        sync: false

  # All-channel daily sales: native platform sales plus Target's dated report.
  # The adjacent DST candidate exits before any source or database read.
  # Run after morning feeds, at 08:00 America/Los_Angeles throughout the year.
  - type: cron
    name: based-inventory-velocity
    runtime: docker
    # Reuse the Python 3.12 image with psycopg and migration files. This report
    # entrypoint does not enable the separate source/tracker publishers.
    dockerfilePath: ./Dockerfile.pipeline
    schedule: "0 15,16 * * *"
    dockerCommand: python scripts/post_sales_velocity.py --at-local-time 08:00
    plan: starter
    envVars:
      - fromService:
          name: based-inventory-quantity
          type: cron
          envVarKey: SHIPHERO_ACCESS_TOKEN
        key: SHIPHERO_ACCESS_TOKEN
      - fromService:
          name: based-inventory-quantity
          type: cron
          envVarKey: SHIPHERO_REFRESH_TOKEN
        key: SHIPHERO_REFRESH_TOKEN
      - key: SHIPHERO_API_URL
        value: https://public-api.shiphero.com/graphql
      - key: SHOPIFY_STORE
        value: basedbodyworks.myshopify.com
      - key: SHOPIFY_CLIENT_ID
        value: not-used-by-velocity
      - key: SHOPIFY_CLIENT_SECRET
        value: not-used-by-velocity
      - key: SHOPIFY_API_VERSION
        value: "2026-01"
      - fromService:
          name: based-inventory-quantity
          type: cron
          envVarKey: SLACK_BOT_TOKEN
        key: SLACK_BOT_TOKEN
      - key: SLACK_CHANNEL
        value: C0AK6UGA1NJ
      # At rollout, bind the existing paid cloud-sales PostgreSQL connection.
      # The free quantity-alert Redis service is not a durable sales archive.
      - key: VELOCITY_DATABASE_URL
        sync: false
      # Reuse the already configured server credentials at rollout.
      - key: POLAR_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      - key: TARGET_GMAIL_QUERY
        value: 'from:zach.haugen@onepltfrm.com subject:"Target Daily Sales Reporting"'
      - key: ENV
        value: prod
      - key: DRY_RUN
        value: "0"
      - key: LOG_LEVEL
        value: INFO
