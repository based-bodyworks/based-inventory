name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"

jobs:
  lint-test:
    # Pinned to 22.04 because Playwright 1.44's `install --with-deps` still
    # references libasound2, which Ubuntu 24 renamed to libasound2t64.
    # Bumping Playwright would reach across into production — cheaper to
    # pin the runner here. Revisit when we upgrade Playwright deliberately.
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-ci-password
          POSTGRES_DB: pipeline_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_PIPELINE_DATABASE_URL: postgresql://postgres:synthetic-ci-password@127.0.0.1:5432/pipeline_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Install Playwright chromium
        run: python -m playwright install chromium --with-deps
      - run: ruff check
      - run: ruff format --check
      - run: pytest
      - name: Build production image
        run: docker build -t based-inventory-ci .
      - name: Check velocity entrypoint in production image
        run: docker run --rm based-inventory-ci python scripts/daily_sales_velocity.py --help
      - name: Build cloud pipeline image
        run: docker build -f Dockerfile.pipeline -t based-sales-pipeline-ci .
      - name: Check cloud pipeline entrypoint
        run: docker run --rm based-sales-pipeline-ci python -m based_inventory.pipeline --help
      - name: Check daily SKU report entrypoint in its production image
        run: docker run --rm based-sales-pipeline-ci python scripts/post_velocity_to_slack.py --help
      - name: Check all-channel daily sales entrypoint in its production image
        run: docker run --rm based-sales-pipeline-ci python scripts/post_sales_velocity.py --help
      - name: Check durable daily sales migration is included in the image
        run: docker run --rm based-sales-pipeline-ci python -c "from pathlib import Path; assert Path('/app/migrations/002_daily_velocity_archive.sql').is_file()"
